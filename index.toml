# Official repoke plugins. `repoke plugin search` reads this file and `repoke plugin install <id>`
# downloads `file`, shows it and copies it into place.
format = 1

[[plugin]]
id = "omz"
name = "oh-my-zsh"
kind = "executable"
file = "plugins/omz/repoke-omz"
os = ["macos", "linux"]
requires = ["git", "zsh"]
description = "Updates the oh-my-zsh clone when its branch is behind the remote"
sha256 = "dacd98e91ba739a99ca5c87a09511dcefe08a42e5c17eb9d880b184c94d6bb3c"
url = "https://github.com/paveldelpozo/repoke-plugins/releases/download/files/repoke-omz-dacd98e91ba7"
discussion = "https://github.com/paveldelpozo/repoke-plugins/discussions/1"
downloads = 1
votes = 1

[[plugin]]
id = "vscode"
name = "VS Code extensions"
kind = "executable"
file = "plugins/vscode/repoke-vscode"
os = ["macos", "linux"]
requires = ["code", "python3"]
description = "Extensions with a newer stable release on the Visual Studio Marketplace; also export and init"
sha256 = "d25507488b88df77ee4a629b9c44e5de26f2f530d03d508bb9fed8952bd25dbc"
url = "https://github.com/paveldelpozo/repoke-plugins/releases/download/files/repoke-vscode-d25507488b88"
discussion = "https://github.com/paveldelpozo/repoke-plugins/discussions/2"
downloads = 1
votes = 1

[[plugin]]
id = "git"
name = "Git config"
kind = "executable"
file = "plugins/git/repoke-git"
os = ["macos", "linux"]
requires = ["git"]
description = "Carries .gitconfig and ~/.config/git in repoke export, to restore with init (repoke 0.7 or later)"

[[plugin]]
id = "zsh"
name = "zsh config"
kind = "executable"
file = "plugins/zsh/repoke-zsh"
os = ["macos", "linux"]
requires = ["zsh"]
description = "Carries .zshrc and the other zsh startup files in repoke export, to restore with init (repoke 0.7 or later)"

[[plugin]]
id = "zinit"
name = "zsh plugins (zinit)"
kind = "executable"
file = "plugins/zinit/repoke-zinit"
os = ["macos", "linux"]
requires = ["git", "zsh"]
description = "Updates zinit and the zsh plugins it cloned when their branch is behind the remote"

[[plugin]]
id = "antidote"
name = "zsh plugins (antidote)"
kind = "executable"
file = "plugins/antidote/repoke-antidote"
os = ["macos", "linux"]
requires = ["git", "zsh"]
description = "Bundles with new commits, as antidote update --dry-run reports them, and antidote itself when it is a git clone"

[[plugin]]
id = "tpm"
name = "tmux plugins (tpm)"
kind = "executable"
file = "plugins/tpm/repoke-tpm"
os = ["macos", "linux"]
requires = ["git", "tmux"]
description = "Updates tpm and the tmux plugins it cloned when their branch is behind the remote"

[[plugin]]
id = "lazy"
name = "lazy.nvim"
kind = "executable"
file = "plugins/lazy/repoke-lazy"
os = ["macos", "linux"]
requires = ["nvim", "git"]
description = "Neovim plugins managed by lazy.nvim that :Lazy update would move to a newer commit or release"

[[plugin]]
id = "vimplug"
name = "vim-plug"
kind = "executable"
file = "plugins/vimplug/repoke-vimplug"
os = ["macos", "linux"]
requires = ["git"]
description = "Vim or Neovim plugins in your Plug list whose branch is behind the remote or whose wildcard tag has a newer match"

[[plugin]]
id = "gcloud"
name = "gcloud components"
kind = "executable"
file = "plugins/gcloud/repoke-gcloud"
os = ["macos", "linux"]
requires = ["gcloud"]
description = "Google Cloud SDK components with an update available; also export and init"
